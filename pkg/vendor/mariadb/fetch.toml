# vendor/mariadb's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite3/fetch.toml.
#
# Every host builds libmariadb itself, by build/build.sh -- so that every auth plugin is built in
# (a plugin left separate is looked for in a plugin directory at connect time) and, on Linux,
# OpenSSL is folded in -- from these pinned sources: Connector/C 3.4.11 (the 3.4 LTS line; a GitHub tag archive, its
# SHA-256 measured, as upstream publishes none for it) and OpenSSL 3.5.9 (upstream's SHA-256),
# which Linux and macOS fold into the library and Windows does not use (Schannel). DYNAMIC ONLY: the
# library is LGPL-2.1 (claude-docs docs/tiko-vendor RFC-0003 DB-2).
#
# THE NAMES are what '#foreignlib MARIADB dynamic "lib/libmariadb"' probes: libmariadb.dll on
# Windows -- the name inside it, which a program's import names -- and libmariadb_linux_x86_64.so
# on Linux (x86_64 or arm64), its soname its own file name; on macOS libmariadb_macos_arm64.dylib,
# its install name @rpath/ and its file name.
version = "3.4.11"

[windows.1]
kind = "script"
script = "build/build.sh"
inputs = "https://github.com/mariadb-corporation/mariadb-connector-c/archive/refs/tags/v3.4.11.tar.gz 7cdb35c571dd0c187f806f569285829d31b4aba4feb93957a034b0b1e887e276 https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"
from = "build/bin/windows/libmariadb.dll"
to = "lib/libmariadb.dll"

[linux.1]
kind = "script"
script = "build/build.sh"
inputs = "https://github.com/mariadb-corporation/mariadb-connector-c/archive/refs/tags/v3.4.11.tar.gz 7cdb35c571dd0c187f806f569285829d31b4aba4feb93957a034b0b1e887e276 https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"
from = "build/bin/linux/libmariadb_linux_x86_64.so"
to = "lib/libmariadb_linux_x86_64.so"

[linux-arm64.1]
kind = "script"
script = "build/build.sh"
inputs = "https://github.com/mariadb-corporation/mariadb-connector-c/archive/refs/tags/v3.4.11.tar.gz 7cdb35c571dd0c187f806f569285829d31b4aba4feb93957a034b0b1e887e276 https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"
from = "build/bin/linux-arm64/libmariadb_linux_arm64.so"
to = "lib/libmariadb_linux_arm64.so"

[macos.1]
kind = "script"
script = "build/build.sh"
inputs = "https://github.com/mariadb-corporation/mariadb-connector-c/archive/refs/tags/v3.4.11.tar.gz 7cdb35c571dd0c187f806f569285829d31b4aba4feb93957a034b0b1e887e276 https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"
from = "build/bin/macos/libmariadb_macos_arm64.dylib"
to = "lib/libmariadb_macos_arm64.dylib"
