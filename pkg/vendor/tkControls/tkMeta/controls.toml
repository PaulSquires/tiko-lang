# tkMeta: what a form designer knows about each tkControls control.
# The source of truth for tkMeta.gen.tiko and every <module>.forms.tiko wrapper file.
# After changing it, run examples/tkControls/tools/tkmetagen.
#
# kind: text glyph file int bool float color enum font. enum lists Shown=CONSTANT pairs.
# get = "" means a write-only property; design = false is not applied on the design canvas.

[[control]]
name = "Label"
module = "tkLabel"
category = "Common"
width = 100
height = 24
default_event = "Click"
props = [
  { name="Text", kind="text", set="tkLabel_SetText", get="tkLabel_GetText", default="Label" },
  { name="Align", kind="enum", enum="Left=LBL_ALIGN_LEFT,Center=LBL_ALIGN_CENTER,Right=LBL_ALIGN_RIGHT", set="tkLabel_SetAlign", get="tkLabel_GetAlign", default="Left" },
  { name="VAlign", kind="enum", enum="Top=LBL_VALIGN_TOP,Center=LBL_VALIGN_CENTER,Bottom=LBL_VALIGN_BOTTOM", set="tkLabel_SetVAlign", get="tkLabel_GetVAlign", default="Center" },
  { name="WordWrap", kind="bool", set="tkLabel_SetWordWrap", get="tkLabel_GetWordWrap", default="false" },
  { name="Ellipsis", kind="bool", set="tkLabel_SetEllipsis", get="tkLabel_GetEllipsis", default="false" },
  { name="AutoSize", kind="bool", set="tkLabel_SetAutoSize", get="tkLabel_GetAutoSize", default="false" },
  { name="TextColor", kind="color", set="tkLabel_SetTextColor", get="tkLabel_GetTextColor" },
  { name="BackColor", kind="color", set="tkLabel_SetBackColor", get="tkLabel_GetBackColor" },
  { name="Transparent", kind="bool", set="tkLabel_SetTransparent", get="tkLabel_GetTransparent", default="true" },
  { name="Font", kind="font", set="tkLabel_SetFont", get="tkLabel_GetFont" },
]
events = [
  { name="Click", set="tkLabel_SetClickCallback", type="LBL_ClickCallbackSub", sig="byval hLabel as TK_WIDGET ptr, byval id as long", params="", args="" },
]

