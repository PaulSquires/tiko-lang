# vendor/tkControls' binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite3/fetch.toml, plus:
#
#   kind = "script"  no download: 'script' (a path in this package) is run with bash, and
#                    'from' (what it made) is copied to 'to'
#   kind = "copy"    with a url that is a single file rather than an archive: that file,
#                    copied to 'to' ('from' is not needed)
#
# THE FONTS (fonts/) are the package's own, the same on every host, so each host repeats the
# entries. tkHost names them (TK_FONT_*); pkg/vendor/tiko.toml's 'runtime' copies them beside
# every program that imports tkHost, with their licences. Inter and Cascadia Mono are under the
# SIL Open Font License 1.1, Fluent UI System Icons under MIT.
#
# SCINTK (lib/) is tkCodeEdit's Scintilla, built from tkCodeEdit/scintk by its own build.sh --
# clang++ on Windows (vendorfetch.sh sets CXX), g++ on Linux, clang++ on macOS. tkCodeEdit
# loads it at run time; 'runtime' copies it beside the program.

[windows.1]
kind = "script"
script = "tkCodeEdit/scintk/build.sh"
from = "tkCodeEdit/scintk/bin/windows/scintk.dll"
to = "lib/scintk.dll"

