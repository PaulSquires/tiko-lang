# vendor/compression's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite3/fetch.toml.
#
# None of the six upstreams publishes the library this package is -- seven codecs in one -- so
# every host builds it, with src/build.sh, from six pinned source archives (the newest releases
# on 2026-11-26): zlib 1.4 (and its contrib/minizip), zstd 1.6.0, xz 5.8.4 (its GitHub tag
# archive, not a release tarball: none of xz's autotools files is used), brotli 1.2.1, lz4 1.11.1
# and bzip2 1.0.8. One build makes both libraries of a host; each entry copies one (the script
# returns at once when its stamp matches). Pinned and probed by RFC-0006 P0 (claude-docs
# docs/tiko-vendor/probes/cp0).
#
# THE NAMES are what '#foreignlib COMPRESSION ... "lib/compression"' probes:
# compression_<os>_<arch>.a for static; for dynamic compression.dll on Windows -- the name inside
# it, which a program's import names -- compression_linux_x86_64.so on Linux,
# compression_linux_arm64.so on arm64 Linux and compression_macos_arm64.dylib on macOS.
#
# HOSTS: Windows x64 and Linux x64 (RFC-0006 P1); Linux arm64, macOS arm64 and Android (P2).
