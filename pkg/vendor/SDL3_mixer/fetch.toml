# vendor/SDL3_mixer's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite/fetch.toml.
#
# THE NAME is what '#foreignlib SDL3_mixer dynamic "lib/SDL3_mixer"' probes: on Windows the DLL keeps its
# own name, SDL3_mixer.dll. SDL publishes release binaries for Windows only, and no static library;
# the archive's optional/ DLLs (extra formats, loaded on demand) are not shipped.
version = "3.2.4"

[windows.1]
kind = "copy"
url = "https://github.com/libsdl-org/SDL_mixer/releases/download/release-3.2.4/SDL3_mixer-3.2.4-win32-x64.zip"
sha256 = "9af526f8defc72ca3b979a6dc4d9e549e5be4dd8db3190cfa8941923a78f73cb"
from = "SDL3_mixer.dll"
to = "lib/SDL3_mixer.dll"
