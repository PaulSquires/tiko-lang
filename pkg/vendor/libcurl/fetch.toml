# vendor/libcurl's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite3/fetch.toml.
#
# curl publishes no library a tiko program can link, so every host builds, through
# build/build.sh: libcurl 8.23.0 SELF-CONTAINED -- libssh2 1.11.1 (SFTP, SCP) and OpenSSL 3.5.9
# inside it (claude-docs docs/tiko-vendor RFC-0004 FT-11; libssh2 + libcrypto by vendor/libssh2's
# own build script, so the pins are that package's). TLS is Schannel on Windows, OpenSSL on Linux.
#
# THE NAMES are what '#foreignlib CURL ... "lib/libcurl"' probes: libcurl_<os>_<arch>.a for
# static; for dynamic libcurl.dll on Windows (the name inside it, which a program's import
# names) and libcurl_linux_x86_64.so on Linux. macOS and linux-arm64: RFC-0004 P3.
version = "8.23.0"

[windows.1]
kind = "script"
script = "build/build.sh"
inputs = "https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a https://libssh2.org/download/libssh2-1.11.1.tar.gz d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7 https://curl.se/download/curl-8.23.0.tar.xz 8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5"
from = "build/bin/windows/libcurl.dll"
to = "lib/libcurl.dll"

[windows.2]
kind = "script"
script = "build/build.sh"
inputs = "https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a https://libssh2.org/download/libssh2-1.11.1.tar.gz d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7 https://curl.se/download/curl-8.23.0.tar.xz 8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5"
from = "build/bin/windows/libcurl_windows_x86_64.a"
to = "lib/libcurl_windows_x86_64.a"

[linux.1]
kind = "script"
script = "build/build.sh"
inputs = "https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a https://libssh2.org/download/libssh2-1.11.1.tar.gz d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7 https://curl.se/download/curl-8.23.0.tar.xz 8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5"
from = "build/bin/linux/libcurl_linux_x86_64.so"
to = "lib/libcurl_linux_x86_64.so"

[linux.2]
kind = "script"
script = "build/build.sh"
inputs = "https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a https://libssh2.org/download/libssh2-1.11.1.tar.gz d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7 https://curl.se/download/curl-8.23.0.tar.xz 8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5"
from = "build/bin/linux/libcurl_linux_x86_64.a"
to = "lib/libcurl_linux_x86_64.a"
