# vendor/SDL3_ttf's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite/fetch.toml.
#
# THE NAME is what '#foreignlib SDL3_ttf dynamic "lib/SDL3_ttf"' probes: on Windows the DLL keeps its
# own name, SDL3_ttf.dll. SDL publishes release binaries for Windows only, and no static library;
# the archive's optional/ DLLs (extra formats, loaded on demand) are not shipped.
version = "3.2.2"

[windows.1]
kind = "copy"
url = "https://github.com/libsdl-org/SDL_ttf/releases/download/release-3.2.2/SDL3_ttf-3.2.2-win32-x64.zip"
sha256 = "13455007029cf487c5aacaa6ff84406be78ffdbed08f933aba3668680ff245f8"
from = "SDL3_ttf.dll"
to = "lib/SDL3_ttf.dll"
