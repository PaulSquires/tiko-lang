# vendor/SDL3_image's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite/fetch.toml.
#
# THE NAME is what '#foreignlib SDL3_image dynamic "lib/SDL3_image"' probes: on Windows the DLL keeps its
# own name, SDL3_image.dll. SDL publishes release binaries for Windows only, and no static library;
# the archive's optional/ DLLs (extra formats, loaded on demand) are not shipped.
version = "3.4.4"

[windows.1]
kind = "copy"
url = "https://github.com/libsdl-org/SDL_image/releases/download/release-3.4.4/SDL3_image-3.4.4-win32-x64.zip"
sha256 = "15c88c3f4e20c0bd0640d7e6ebd40c8112cde308fc2bb5d0c92fa921f5745613"
from = "SDL3_image.dll"
to = "lib/SDL3_image.dll"
