# The vendor package: C libraries the toolchain ships, each a module
# '#import "vendor/<module>" [link static|dynamic]' reaches with nothing on the command line.
# Reserved like std: found in the toolchain's pkg/ alone. Each module's translated headers
# are committed; its binaries are not -- build/vendorfetch.sh fetches or builds them, pinned,
# into <module>/lib when the toolchain is packaged, from <module>/fetch.toml.
[package]
name = "vendor"
version = "0.1.0"

# vendor/PsControls/* (Win32 controls written in tiko, source only) call bare Win32 names, and
# UNICODE is what binds each to its W form. A module never sees its importer's defines, so the
# package sets it; no other module here includes a Windows header.
[defines]
UNICODE = "1"

# The link modes each module ships: what '#import ... link' may ask for.
[vendor.sqlite3]
links = ["static", "dynamic"]

[vendor.SDL3]
links = ["static", "dynamic"]

[vendor.SDL3.image]
links = ["static", "dynamic"]

[vendor.SDL3.ttf]
links = ["static", "dynamic"]

[vendor.SDL3.mixer]
links = ["dynamic"]

# raylib6/raymath and raylib6/rlgl link nothing of their own -- each brings vendor/raylib6, which
# links raylib -- so the link mode is chosen on vendor/raylib6.
[vendor.raylib6]
links = ["static", "dynamic"]

# cJSON/utils links nothing of its own -- cJSON_Utils.c is in cJSON's library -- so the link
# mode is chosen on vendor/cJSON.
[vendor.cJSON]
links = ["static", "dynamic"]

# vendor/tkControls (SDL3 controls in tiko, source only) links nothing of its own -- vendor/SDL3
# does -- but needs files at run time, copied beside every program that imports the module:
# tkHost's bundled fonts and their licences (every tk program imports tkHost), and the scintk
# library tkCodeEdit loads. All are fetched or built by build/vendorfetch.sh (its fetch.toml).
[vendor.tkControls.tkHost]
runtime = ["../fonts/Inter-Regular.ttf", "../fonts/Inter-Bold.ttf", "../fonts/Inter-Italic.ttf", "../fonts/CascadiaMono-Regular.ttf", "../fonts/FluentSystemIcons-Regular.ttf", "../fonts/Inter-LICENSE.txt", "../fonts/CascadiaMono-LICENSE.txt", "../fonts/FluentSystemIcons-LICENSE.txt"]

[vendor.tkControls.tkCodeEdit]
links = ["static", "dynamic"]
runtime = ["../lib/scintk"]
