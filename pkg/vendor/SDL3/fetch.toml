# vendor/SDL3's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite3/fetch.toml.
#
# THE NAME is what '#foreignlib SDL3 dynamic "lib/SDL3"' probes: on Windows the DLL keeps its
# own name, SDL3.dll -- the name inside it, which a program's import names; image/, ttf/ and
# mixer/'s '#foreignlib' probe "../lib/SDL3_image" and the like, beside it. SDL publishes
# release binaries for Windows only, and no static library; the satellite archives' optional/
# DLLs (extra formats, loaded on demand) are not shipped. 'version' is SDL3's own; each
# satellite's is in its url.
version = "3.4.4"

[windows.1]
kind = "copy"
url = "https://github.com/libsdl-org/SDL/releases/download/release-3.4.4/SDL3-3.4.4-win32-x64.zip"
sha256 = "501753053faa70fd4183e5322bbaee460984ead4fd056e334a3088847dad8886"
from = "SDL3.dll"
to = "lib/SDL3.dll"

[windows.2]
kind = "copy"
url = "https://github.com/libsdl-org/SDL_image/releases/download/release-3.4.4/SDL3_image-3.4.4-win32-x64.zip"
sha256 = "15c88c3f4e20c0bd0640d7e6ebd40c8112cde308fc2bb5d0c92fa921f5745613"
from = "SDL3_image.dll"
to = "lib/SDL3_image.dll"

[windows.3]
kind = "copy"
url = "https://github.com/libsdl-org/SDL_ttf/releases/download/release-3.2.2/SDL3_ttf-3.2.2-win32-x64.zip"
sha256 = "13455007029cf487c5aacaa6ff84406be78ffdbed08f933aba3668680ff245f8"
from = "SDL3_ttf.dll"
to = "lib/SDL3_ttf.dll"

[windows.4]
kind = "copy"
url = "https://github.com/libsdl-org/SDL_mixer/releases/download/release-3.2.4/SDL3_mixer-3.2.4-win32-x64.zip"
sha256 = "9af526f8defc72ca3b979a6dc4d9e549e5be4dd8db3190cfa8941923a78f73cb"
from = "SDL3_mixer.dll"
to = "lib/SDL3_mixer.dll"
