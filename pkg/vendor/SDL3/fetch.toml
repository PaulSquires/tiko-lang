# vendor/SDL3's binaries, for build/vendorfetch.sh. Read by that script alone and never
# shipped; the entry format is described in ../sqlite/fetch.toml.
#
# THE NAME is what '#foreignlib SDL3 dynamic "lib/SDL3"' probes: on Windows the DLL keeps its
# own name, SDL3.dll -- the name inside it, which a program's import names. SDL publishes
# release binaries for Windows only, and no static library.
version = "3.4.4"

[windows.1]
kind = "copy"
url = "https://github.com/libsdl-org/SDL/releases/download/release-3.4.4/SDL3-3.4.4-win32-x64.zip"
sha256 = "501753053faa70fd4183e5322bbaee460984ead4fd056e334a3088847dad8886"
from = "SDL3.dll"
to = "lib/SDL3.dll"
