---
title: "The tiko Programming Language"
author: "Paul Squires"
lang: en-CA
date: 2026

## --- the pin -------------------------------------------------------------
## Every listing in this book is compiled and run with exactly these
## toolchains. tools/check-listings.sh refuses to run if `tiko --version`
## does not match, because a stale toolchain yields a plausible number
## rather than an error.
pin:
  version: "0.1.0-dev"
  windows:
    root: "../toolchains/tiko-windows"      # relative to this book directory
    exe: "tiko.exe"
    commit: "e021fce3"
    packaged: "2026-10-02"
  linux:
    root: "../toolchains/tiko-linux"        # same path, reached through WSL
    exe: "bin/tiko"
    commit: "e021fce3"
    packaged: "2026-10-02"
    wsl_distro: "Ubuntu"
  targets: [win64-msvc, linux-x86_64]

## --- production ----------------------------------------------------------
trim: "7in x 9.25in"
fonts:
  body: "New Computer Modern"
  code: "DejaVu Sans Mono"
licence:
  text: "CC BY-NC-SA 4.0"
  code: "MIT"

