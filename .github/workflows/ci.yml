# ci.yml -- the first second machine (review BLD-13, 2026-10-24).
#
# Windows and Linux: fetch the pinned seed, build Debug with the test runner, lint, run
# the suite. The fbc gates (crosslink, check-*.sh) need fbc-modern and stay a local or
# self-hosted job: without an oracle they exit 77, SKIPPED.
#
# THE SUITE STILL LINKS toolchains/tiko-<host>/lib (review BLD-01), which is gitignored. The
# seed IS a packaged toolchain, so its lib/ and inc/ are laid out there for the tests. When
# the suite builds lib/rt for itself this step goes.
#
# THE MINGW LANES (2026-11-08): win32 and win64 run build/smoke.sh -- the target compiles,
# links its own runtime archive, and runs -- on runners whose only mingw is what the lane
# downloads. They run in PARALLEL with the two suite jobs: four runners, one wall clock.
# The full suite cannot go per-target yet (its cli tests name the target in the file);
# that, and a win32 lane in these jobs proper, stay Phase 4.
#
# LINUX IN SHARDS (2026-11-08): the suite is the long pole on Linux, so build-linux
# uploads bin/ and four suite-linux shards download it and each runs a slice of tests/
# by directory. All four run in parallel; the shard sizes are hand-balanced against
# measured durations -- mir and diagnostics are dumps and compile-to-error (fast),
# std's RUN tests compile and execute (slow). One runner per shard: --no-build skips
# the staleness logic, and the lib/rt each shard needs is rebuilt by test.sh's overlay
# against the artifact's binaries.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TIKO_EDITOR_DIR: /c/nonexistent
      # vendor-pscontrols-public-helpers compiles all of vendor/PsControls cold: 253 s on
      # Windows and 388 s on Linux in a Debug build, alone. 300 killed it.
      TIKO_TEST_TIMEOUT: "900"
    steps:
      # THE BYTES AS COMMITTED, as tiko-lang's own checkouts have them (core.autocrlf false).
      # The runner's default, true, turned pkg/sys/posix/*.ti into CRLF while .gitattributes
      # keeps lib/rt LF, and lint's byte compare of the two copies failed on identical blobs.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Fetch the pinned seed
        run: sh seed/fetch-seed.sh --host windows
      - name: Lay out the seed's toolchain where the tests link it
        run: |
          mkdir -p toolchains
          cp -r seed/cache/windows/tiko-windows toolchains/tiko-windows || cp -r seed/cache/windows toolchains/tiko-windows
          ls toolchains/tiko-windows/lib
      - name: clang
        run: |
          command -v clang || echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
      - name: Build (Debug, test runner)
        run: bash build/build.sh Debug --no-dll --test-runner
      - name: Lint
        run: |
          bash build/lint.sh
          bash lib/rt/build/lint.sh
      - name: Suite
        run: bash build/test.sh --no-build

  win32-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      TIKO_EDITOR_DIR: /c/nonexistent
    steps:
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # THE i686 MSVCRT-FLAVOR WINLIBS, the same build the win32 bring-up ran against
      # (gcc 16.2.0-r2): clang finds the sysroot through the gcc this puts on PATH.
      - name: Cache the mingw32 toolchain
        id: mingw32
        uses: actions/cache@v4
        with:
          path: ~/mingw32
          key: winlibs-i686-16.2.0-msvcrt-14.0.0-r2
      - name: Fetch the mingw32 toolchain
        if: steps.mingw32.outputs.cache-hit != 'true'
        run: |
          curl -sL -o winlibs32.zip "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-msvcrt-r2/winlibs-i686-posix-dwarf-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r2.zip"
          mkdir -p ~/mingw32
          unzip -q winlibs32.zip -d ~/mingw32
          ~/mingw32/mingw32/bin/gcc.exe --version | head -1
      - name: mingw32 on PATH
        run: echo "$HOME/mingw32/mingw32/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned seed
        run: sh seed/fetch-seed.sh --host windows
      - name: clang
        run: echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
      - name: Build (Release, no dll)
        run: bash build/build.sh Release --no-dll
      - name: lib/rt for win32
        run: TIKORT_TIKO="$PWD/bin/tiko.exe" bash lib/rt/build/build.sh Release win32
      - name: Smoke (win32)
        run: |
          bash build/smoke.sh win32
          bash build/smoke.sh win32 --mt

  win64-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      TIKO_EDITOR_DIR: /c/nonexistent
    steps:
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # THE x86_64 MSVCRT-FLAVOR WINLIBS -- lib/win64 is an msvcrt-flavor archive, and
      # the ucrt-flavor mingw a runner might carry does not answer its imports.
      - name: Cache the mingw64 toolchain
        id: mingw64
        uses: actions/cache@v4
        with:
          path: ~/mingw64
          key: winlibs-x86_64-16.2.0-msvcrt-14.0.0-r2
      - name: Fetch the mingw64 toolchain
        if: steps.mingw64.outputs.cache-hit != 'true'
        run: |
          curl -sL -o winlibs64.zip "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-msvcrt-r2/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r2.zip"
          mkdir -p ~/mingw64
          unzip -q winlibs64.zip -d ~/mingw64
          ~/mingw64/mingw64/bin/gcc.exe --version | head -1
      - name: mingw64 on PATH
        run: echo "$HOME/mingw64/mingw64/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned seed
        run: sh seed/fetch-seed.sh --host windows
      - name: clang
        run: echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
      - name: Build (Release, no dll)
        run: bash build/build.sh Release --no-dll
      - name: lib/rt for win64
        run: TIKORT_TIKO="$PWD/bin/tiko.exe" bash lib/rt/build/build.sh Release win64
      - name: Smoke (win64)
        run: |
          bash build/smoke.sh win64
          bash build/smoke.sh win64 --mt

  linux:
    # THE BUILDER: compiles the compiler and the runner, lints, and uploads bin/ for
    # the shards. Nothing here runs the suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TIKO_EDITOR_DIR: /nonexistent
      TIKO_TEST_TIMEOUT: "900"
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          echo "TIKO_CLANG=/usr/bin/clang-18" >> "$GITHUB_ENV"
          echo "TIKO_AR=/usr/bin/llvm-ar-18" >> "$GITHUB_ENV"
          echo "TIKO_NM=/usr/bin/llvm-nm-18" >> "$GITHUB_ENV"
      - name: Fetch the pinned seed
        run: sh seed/fetch-seed.sh --host linux
      - name: Lay out the seed's toolchain where the tests link it
        run: |
          mkdir -p toolchains
          cp -r seed/cache/linux/tiko-linux toolchains/tiko-linux || cp -r seed/cache/linux toolchains/tiko-linux
          ls toolchains/tiko-linux/lib
      - name: Build (Debug, test runner)
        run: bash build/build.sh Debug --no-dll --test-runner
      - name: Lint
        run: |
          bash build/lint.sh
          bash lib/rt/build/lint.sh
      - name: Upload bin for the shards
        uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: bin/
          retention-days: 1

  suite-linux:
    # THE SHARDS. Four runners in parallel, one slice of tests/ each, hand-balanced
    # against measured durations: mir and diagnostics are dumps and compile-to-error
    # (fast), std and modules compile and RUN (slow). Every shard needs the seed laid
    # out and the LLVM 18 the tests compile with -- the tree's lib/rt is rebuilt by
    # test.sh's overlay against the downloaded binaries.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: linux
    env:
      TIKO_EDITOR_DIR: /nonexistent
      TIKO_TEST_TIMEOUT: "900"
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: diagnostics
            dirs: "tests/diagnostics tests/types tests/symbols tests/api tests/mangle tests/lexer tests/rtl tests/check"
          - name: mir
            dirs: "tests/mir"
          - name: codegen
            dirs: "tests/codegen tests/parser tests/pp tests/c2t tests/cimport"
          - name: std-modules
            dirs: "tests/std tests/modules tests/driver tests/source tests/abi tests/expected tests/semantic tests/vendor"
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          echo "TIKO_CLANG=/usr/bin/clang-18" >> "$GITHUB_ENV"
          echo "TIKO_AR=/usr/bin/llvm-ar-18" >> "$GITHUB_ENV"
          echo "TIKO_NM=/usr/bin/llvm-nm-18" >> "$GITHUB_ENV"
      - name: Fetch the pinned seed
        run: sh seed/fetch-seed.sh --host linux
      - name: Lay out the seed's toolchain where the tests link it
        run: |
          mkdir -p toolchains
          cp -r seed/cache/linux/tiko-linux toolchains/tiko-linux || cp -r seed/cache/linux toolchains/tiko-linux
      - name: Download bin
        uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: bin/
      - name: Make the binaries executable
        run: chmod +x bin/tiko bin/tiko-test 2>/dev/null || chmod +x bin/*
      - name: Suite (shard ${{ matrix.shard.name }})
        run: bash build/test.sh --no-build ${{ matrix.shard.dirs }}
