name: Runtime / Library Issue
description: Report a problem with the tiko-lang runtime or standard library
title: "[Runtime]: "
labels:
  - runtime
  - needs-triage

body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Runtime
        - Standard Library
        - File I/O
        - String Handling
        - Memory Management
        - Threading
        - Atomics
        - Networking
        - Date / Time
        - Math
        - Containers
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Minimal Reproduction
      render: freebasic

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: tiko-lang Version
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - Windows x86
        - Linux x64
        - Linux ARM64
        - macOS
        - Other
    validations:
      required: true