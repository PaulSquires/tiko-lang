name: Modern Feature Bug
description: Report a problem with an tiko-lang-specific language feature
title: "[Modern Feature]: "
labels:
  - bug
  - modern-feature
  - needs-triage

body:
  - type: markdown
    attributes:
      value: |
        Use this template for bugs involving language features introduced
        by tiko-lang that are not part of standard FreeBASIC.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I have searched existing issues.
          required: true
        - label: This behavior involves an tiko-lang-specific feature.
          required: true
        - label: I have tested the latest tiko-lang version.
          required: true

  - type: input
    id: feature
    attributes:
      label: Modern Feature
      description: Name of the tiko-lang feature involved.
      placeholder: "e.g. lambdas, atomics, pattern matching"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source Code
      description: Provide the smallest reproduction.
      render: freebasic
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Compiler Output
      render: text

  - type: input
    id: version
    attributes:
      label: tiko-lang Version
      placeholder: "e.g. 1.0.0 or commit hash"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Target Platform
      options:
        - Windows x64
        - Windows x86
        - Linux x64
        - Linux ARM64
        - macOS
        - Other
    validations:
      required: true