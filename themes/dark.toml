# tkEdit dark theme (the built-in default). Colours are "#rrggbb"; a syntax entry is a colour
# or a table { fg, bg, bold, italic }. Copy this file to <config>/themes/ under a new name to
# make your own, then set [ui] theme = '<name>' in settings.toml.
name = "dark"

[ui]
bg = "#1e1e1e"
fg = "#d4d4d4"
statusbar = "#252526"
statusbar_fg = "#cccccc"
popup = "#252526"
popup_sel = "#04395e"
accent = "#0e639c"
border = "#3c3c3c"

[editor]
bg = "#1e1e1e"
fg = "#d4d4d4"
caret = "#aeafad"
caret_line = "#2a2d2e"
selection = "#264f78"
gutter = "#1e1e1e"
gutter_fg = "#858585"
fold = "#1e1e1e"
indent_guide = "#404040"
brace = "#515c6a"
find_match = "#623315"
error = "#f14c4c"
warning = "#cca700"
bookmark = "#0e639c"

[syntax]
default = "#d4d4d4"
comment = { fg = "#6a9955", italic = true }
number = "#b5cea8"
keyword = "#569cd6"
keyword2 = "#4ec9b0"
keyword3 = "#dcdcaa"
keyword4 = "#9cdcfe"
string = "#ce9178"
preprocessor = "#c586c0"
operator = "#d4d4d4"
identifier = "#d4d4d4"
