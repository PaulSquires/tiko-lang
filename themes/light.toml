# tkEdit light theme. Colours are "#rrggbb"; a syntax entry is a colour or a table
# { fg, bg, bold, italic }.
name = "light"

[ui]
bg = "#ffffff"
fg = "#1f1f1f"
statusbar = "#f3f3f3"
statusbar_fg = "#3b3b3b"
popup = "#f8f8f8"
popup_sel = "#cce4f7"
accent = "#005fb8"
border = "#d4d4d4"

[editor]
bg = "#ffffff"
fg = "#1f1f1f"
caret = "#000000"
caret_line = "#f2f6fa"
selection = "#add6ff"
gutter = "#ffffff"
gutter_fg = "#6e7681"
fold = "#ffffff"
indent_guide = "#d3d3d3"
brace = "#b9d7f0"
find_match = "#f8c9a0"
error = "#e51400"
warning = "#bf8803"
bookmark = "#005fb8"

[syntax]
default = "#1f1f1f"
comment = { fg = "#008000", italic = true }
number = "#098658"
keyword = "#0000ff"
keyword2 = "#267f99"
keyword3 = "#795e26"
keyword4 = "#001080"
string = "#a31515"
preprocessor = "#af00db"
operator = "#1f1f1f"
identifier = "#1f1f1f"
