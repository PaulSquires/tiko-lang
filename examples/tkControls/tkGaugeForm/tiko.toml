# tkGaugeForm: a designed form (GAUGE-SPARKLINE.md GS4) written as a .tkform and generated by tkEdit
# --generate-forms (frmKpis): KPIs stepped through by a navigator, each one's score on a radial gauge,
# its fill on a linear one and its trend as a sparkline, all bound load-only. Driven as a selftest.
[package]
name = "tkgaugeform"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"
