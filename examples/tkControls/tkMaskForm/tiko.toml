# tkMaskForm: a designed form (MASKEDIT.md M5) written as a .tkform and generated by tkEdit
# --generate-forms (frmOrder): six MaskEdits -- a phone, a postcode, a product code (regex), a price,
# a date of birth, an appointment time -- bound to one record. Driven as a selftest.
[package]
name = "tkmaskform"

[target.selftest]
main   = "selftest.tiko"
output = "selftest.exe"
