# PsListTree demo: tiko build (writes main.exe here; out/ holds the build cache)
[package]
name = "pslisttree"

[target.main]
main    = "main.tiko"
output  = "main.exe"
resources = ["main.rc"]

[target.main.defines]
# every bare Win32 name binds its W form: an importer cannot #define UNICODE itself
UNICODE = "1"

[target.tree_demo]
main    = "tree_demo.tiko"
output  = "tree_demo.exe"
resources = ["main.rc"]

[target.tree_demo.defines]
UNICODE = "1"
