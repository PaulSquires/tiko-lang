# PsApp worker example: tiko build (writes main.exe here; out/ holds the build cache)
[package]
name = "psappworker"

[target.main]
main    = "main.tiko"
output  = "main.exe"
resources = ["main.rc"]
# std/tasks (spawn, channels) needs the multithreaded runtime
options = ["-mt"]

[target.main.defines]
# every bare Win32 name binds its W form: an importer cannot #define UNICODE itself
UNICODE = "1"
