title: "tiko by Example"
author: "Paul Squires"

## --- the pin -------------------------------------------------------------
## Every example on the site is compiled and run with exactly these
## toolchains. tools/check-examples.sh refuses to run if a toolchain's
## MANIFEST does not match, because a stale toolchain yields a plausible
## result rather than an error.
pin:
  version: "0.1.0-dev"
  windows:
    root: "../toolchains/tiko-windows"      # relative to this directory
    exe: "tiko.exe"
    commit: "6a4a8f1ba"
    packaged: "2026-10-20"
  linux:
    root: "../toolchains/tiko-linux"        # same path, reached through WSL
    exe: "bin/tiko"
    commit: "6a4a8f1ba"
    packaged: "2026-10-20"
    wsl_distro: "Ubuntu"
  targets: [windows-x86_64, linux-x86_64]
