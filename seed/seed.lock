# seed.lock -- the pinned SEED: the tiko that builds tiko-lang in fbc-modern's place.
# Read by seed/fetch-seed.sh; used by build/build.sh and build/bootstrap.sh through
# TKO_SEED=<path to its tiko executable>.
#
# A seed is a packaged toolchain (build/package.sh) published as a GitHub Release asset
# on PaulSquires/tiko-lang. One line per host, whitespace-separated:
#
#   host  tag  asset  sha256-of-asset  commit-the-seed-was-built-from
#
# The sha256 is of the ASSET FILE and is checked before anything is extracted. TBD is
# a placeholder: fetch-seed.sh refuses it unless --trust-on-first-use is given, and then
# prints the hash to record here.
#
# THE SEED-COMPATIBILITY RULE: tiko-lang's own source may use a language feature only
# once the pinned seed compiles it. A feature reaches the compiler's own source one seed
# later than it reaches the language. Advance this file at release points, together with
# seed/chain.txt.
#
# PINNED: seed-7, built 2026-10-28 from 42d891dd: the first with a macos line. All three archives
# are the toolchains package.sh --verify produced from 42d891dd (byte-identical to release
# toolchain-42d891dd); windows and linux were built by seed-6, macos by the M6 native compiler
# (docs/tiko-macos). Bootstrapped from each archive with --gate: stage1 == stage2 == stage3 and
# the suite against stage2 fails exactly what it fails against stage1, on all three hosts --
# the first Linux seed in a while to reproduce master (seed-6 had stopped: stage1 != stage2).
# The seeds before it are in chain.txt.
# build/defaultseed.sh prefers seed/cache/<host> -- where fetch-seed.sh unpacks this -- over
# any locally packaged toolchain.

