<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img" aria-label="The tiko Programming Language: book cover">
<title>The tiko Programming Language</title>
<defs>
  <linearGradient id="cv" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7B5CFF"/><stop offset="1" stop-color="#2A1A6E"/>
  </linearGradient>
</defs>
<!-- cover and spine -->
<rect x="4" y="4" width="352" height="472" rx="14" fill="url(#cv)"/>
<rect x="4" y="4" width="26" height="472" rx="14" fill="#000000" fill-opacity="0.22"/>
<rect x="30" y="4" width="2" height="472" fill="#FFFFFF" fill-opacity="0.18"/>
<!-- Tiko, the mascot, on a soft disc so the violet bird reads against the violet cover -->
<circle cx="195" cy="137" r="96" fill="#FFFFFF" fill-opacity="0.16"/>
<g transform="translate(112 53) scale(1.3)">
  <g stroke="#1A1036" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M59 26 Q56 10 72 5 Q68 16 69 26 Z" fill="#FF8A3D"/>
    <ellipse cx="64" cy="70" rx="46" ry="48" fill="#6C4CF1"/>
    <ellipse cx="64" cy="84" rx="28" ry="28" fill="#C9F7E4"/>
    <path d="M20 68 Q6 84 18 98 Q24 88 26 80 Z" fill="#4A2FD1"/>
    <path d="M108 68 Q122 84 110 98 Q104 88 102 80 Z" fill="#4A2FD1"/>
    <circle cx="46" cy="52" r="15" fill="#FFFFFF"/>
    <circle cx="82" cy="52" r="15" fill="#FFFFFF"/>
    <path d="M56 64 L72 64 L64 76 Z" fill="#FF8A3D"/>
    <path d="M50 118 V124 M44 124 H56 M78 118 V124 M72 124 H84" fill="none" stroke="#FF8A3D"/>
  </g>
  <circle cx="49" cy="54" r="6.5" fill="#1A1036"/>
  <circle cx="85" cy="54" r="6.5" fill="#1A1036"/>
  <circle cx="51.5" cy="51" r="2.2" fill="#FFFFFF"/>
  <circle cx="87.5" cy="51" r="2.2" fill="#FFFFFF"/>
  <g fill="none" stroke="#6C4CF1" stroke-width="3.5" stroke-linecap="round" opacity="0.55">
    <path d="M54 86 Q64 92 74 86"/><path d="M52 96 Q64 102 76 96"/>
  </g>
</g>
<!-- title -->
<g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#FFFFFF" text-anchor="middle">
  <text x="195" y="275" font-size="30" font-weight="700">The tiko</text>
  <text x="195" y="309" font-size="30" font-weight="700">Programming</text>
  <text x="195" y="343" font-size="30" font-weight="700">Language</text>
  <rect x="155" y="365" width="80" height="4" rx="2" fill="#3DF5B0"/>
  <text x="195" y="397" font-size="15" fill-opacity="0.85">Code you can read.</text>
  <text x="195" y="416" font-size="15" fill-opacity="0.85">Speed you can measure.</text>
  <text x="195" y="435" font-size="15" fill-opacity="0.85">Binaries you can ship.</text>
</g>
</svg>
